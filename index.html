<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soumalya Chandra | DevOps Engineer</title>

  <!-- SEO -->
  <meta name="description" content="Soumalya Chandra — DevOps Engineer with 6+ years of experience in AWS, CI/CD, Terraform, Docker, Kubernetes, and infrastructure automation." />
  <meta name="keywords" content="DevOps Engineer, AWS, Terraform, Jenkins, Kubernetes, Docker, CI/CD, Infrastructure as Code" />
  <meta name="author" content="Soumalya Chandra" />
  <link rel="canonical" href="https://cyberheister.github.io/terminal-portfolio/" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Soumalya Chandra | DevOps Engineer" />
  <meta property="og:description" content="Interactive terminal portfolio. 6+ years building and operating AWS cloud infrastructure." />
  <meta property="og:url" content="https://cyberheister.github.io/terminal-portfolio/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Soumalya Chandra | DevOps Engineer" />
  <meta name="twitter:description" content="Interactive terminal portfolio. 6+ years building and operating AWS cloud infrastructure." />

  <meta name="theme-color" content="#010409" />

  <!-- Inline favicon: avoids a 404 request without adding a binary asset -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23010409'/><text x='50' y='70' font-size='56' font-family='monospace' fill='%2358a6ff' text-anchor='middle'>&gt;_</text></svg>" />

  <link rel="stylesheet" href="style.css" />

  <!-- Lets CSS style the no-JS fallback without fighting the flex layout. -->
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>

  <main class="terminal-wrapper">
    <section class="terminal" aria-label="Interactive terminal portfolio">

      <div class="titlebar" aria-hidden="true">
        <span class="dot dot-red"></span>
        <span class="dot dot-amber"></span>
        <span class="dot dot-green"></span>
        <span class="titlebar-text">soumalya@portfolio — bash</span>
      </div>

      <div id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>

      <noscript>
        <div class="noscript">
          <h1>Soumalya Chandra — DevOps Engineer</h1>
          <p>
            DevOps Engineer with 6+ years of experience building, automating, and
            operating AWS cloud infrastructure. Strong focus on CI/CD, Infrastructure
            as Code, security, and cost optimization.
          </p>
          <p>
            <strong>Skills:</strong> AWS, Terraform, Jenkins, GitHub Actions, Docker,
            Kubernetes, Python, Bash, Linux.
          </p>
          <p>
            <strong>GitHub:</strong>
            <a href="https://github.com/CyberHeister">github.com/CyberHeister</a>
          </p>
          <p class="noscript-note">
            This portfolio is an interactive terminal. Enable JavaScript for the full experience.
          </p>
        </div>
      </noscript>

      <form class="input-line" id="cmdform" autocomplete="off">
        <label class="prompt" for="cmd">
          <span class="prompt-full">soumalya@portfolio:~$</span>
          <span class="prompt-short">~$</span>
        </label>
        <input
          id="cmd"
          name="cmd"
          type="text"
          autofocus
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-label="Terminal command input"
          aria-describedby="cmd-hint"
        />
        <span id="cmd-hint" class="visually-hidden">
          Type a command such as help, about, skills, projects, or contact, then press Enter.
        </span>
      </form>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
